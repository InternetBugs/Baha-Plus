name: baha_plus
description: A Flutter client for Bahamut Anime with shared Liquid Glass controls.
publish_to: none
version: 0.3.0+4

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  liquid_glass_widgets: 1.16.1
  flutter_inappwebview: 6.1.5
  flutter_staggered_grid_view: 0.7.0
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  unorm_dart: ^0.3.3
  platform_proxy: 0.9.4
  video_player: ^2.14.1
  http: ^1.6.0
  html: ^0.15.7
  package_info_plus: ^10.2.2
  pub_semver: ^2.2.1
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  share_plus: ^13.3.1

dev_dependencies:
  video_player_platform_interface: ^6.9.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/data/
    - assets/adapters/
  fonts:
    - family: BahaSans
      fonts:
        - asset: assets/fonts/NotoSansTC.ttf
    - family: BahaSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
