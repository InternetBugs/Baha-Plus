name: Manual test build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "测试平台（默认仅 iOS）"
        required: true
        default: ios
        type: choice
        options:
          - ios
          - android
          - both
      version:
        description: "测试版本号（留空自动选择下一个版本）"
        required: false
        type: string
      ios_build_mode:
        description: "iOS 构建模式"
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate merged sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Verify adapters and build tools
        run: |
          set -euo pipefail
          npm ci
          npm run resources:check
          npm run typecheck
          npm test
          python3 -m unittest discover -s tests -p 'test_*.py'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Verify Flutter
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub
          flutter test --no-pub --dart-define=BAHA_DIAGNOSTICS=true test/player_session_test.dart test/player_process_recovery_test.dart
      - name: Select test version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python3 tools/release_version.py

  android:
    name: Build signed Android test APK
    needs: validate
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Build APK
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/baha-plus-test.jks
          TEST_VERSION: ${{ needs.validate.outputs.version }}
          BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Android signing secret: $name"
              exit 1
            fi
          done
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          flutter pub get --enforce-lockfile
          flutter build apk --release --dart-define=BAHA_DIAGNOSTICS=true --build-name "$TEST_VERSION" --build-number "$BUILD_NUMBER"
          mkdir -p test-package
          cp build/app/outputs/flutter-apk/app-release.apk test-package/BahaPlus-Android-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: test-package-android
          path: app/test-package/BahaPlus-Android-test.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: Build unsigned iOS ${{ inputs.ios_build_mode || 'release' }} test IPA
    needs: validate
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Validate Xcode project
        working-directory: app/ios
        run: plutil -lint Runner.xcodeproj/project.pbxproj Runner/Info.plist
      - name: Build IPA
        working-directory: app
        env:
          TEST_VERSION: ${{ needs.validate.outputs.version }}
          BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
          IOS_BUILD_MODE: ${{ inputs.ios_build_mode || 'release' }}
        run: |
          set -euo pipefail
          case "$IOS_BUILD_MODE" in
            release|debug) ;;
            *) echo "::error::Unsupported iOS build mode"; exit 1 ;;
          esac
          flutter pub get --enforce-lockfile
          flutter build ios "--$IOS_BUILD_MODE" --no-codesign --dart-define=BAHA_DIAGNOSTICS=true --build-name "$TEST_VERSION" --build-number "$BUILD_NUMBER"
          test -d build/ios/iphoneos/Runner.app
          mkdir -p test-package/Payload
          cp -R build/ios/iphoneos/Runner.app test-package/Payload/
          cd test-package
          ditto -c -k --sequesterRsrc --keepParent Payload "BahaPlus-iOS-test-$IOS_BUILD_MODE-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: test-package-ios
          path: app/test-package/BahaPlus-iOS-test-*-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  ios_native_tests:
    name: Run iOS native tests
    needs: validate
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Build simulator app
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter build ios --simulator --debug --no-codesign
      - name: Test on iPhone simulator
        working-directory: app
        run: |
          set -euo pipefail
          device_id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(device["udid"] for runtime, group in devices.items()
              if "iOS" in runtime for device in group
              if device["name"].startswith("iPhone")))
          ')
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" \
            -resultBundlePath build/ios/playback-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-native-test-results
          path: app/build/ios/playback-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Collect verified test packages
    needs: [validate, android, ios, ios_native_tests]
    if: >-
      always() && !cancelled() && needs.validate.result == 'success' &&
      (needs.android.result == 'success' || needs.android.result == 'skipped') &&
      (needs.ios.result == 'success' || needs.ios.result == 'skipped') &&
      (needs.ios_native_tests.result == 'success' || needs.ios_native_tests.result == 'skipped') &&
      (needs.android.result == 'success' || needs.ios.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: test-package-*
          path: test-package
          merge-multiple: true
      - name: Record build and checksums
        env:
          TEST_VERSION: ${{ needs.validate.outputs.version }}
          BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
          TEST_PLATFORM: ${{ inputs.platform }}
          IOS_BUILD_MODE: ${{ inputs.ios_build_mode || 'release' }}
        working-directory: test-package
        run: |
          set -euo pipefail
          packages=()
          if [[ "$TEST_PLATFORM" == "android" || "$TEST_PLATFORM" == "both" ]]; then
            test -f BahaPlus-Android-test.apk
            packages+=(BahaPlus-Android-test.apk)
          fi
          if [[ "$TEST_PLATFORM" == "ios" || "$TEST_PLATFORM" == "both" ]]; then
            ios_package="BahaPlus-iOS-test-$IOS_BUILD_MODE-unsigned.ipa"
            test -f "$ios_package"
            packages+=("$ios_package")
          fi
          sha256sum "${packages[@]}" > SHA256SUMS.txt
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          platform = os.environ["TEST_PLATFORM"]
          android = platform in ("android", "both")
          ios = platform in ("ios", "both")
          Path("build-info.json").write_text(json.dumps({
              "version": os.environ["TEST_VERSION"],
              "build_number": int(os.environ["BUILD_NUMBER"]),
              "commit": os.environ["GITHUB_SHA"],
              "run": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "platform": platform,
              "android_signing": "production" if android else None,
              "ios_signing": "unsigned" if ios else None,
              "ios_build_mode": os.environ["IOS_BUILD_MODE"] if ios else None,
              "diagnostics": True,
              "checks": ["javascript", "python", "flutter-analyze", "flutter-test"] + (["ios-native-tests"] if ios else []),
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          echo "Test version: $TEST_VERSION ($BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$TEST_PLATFORM" != "android" ]]; then
            echo "iOS build mode: $IOS_BUILD_MODE" >> "$GITHUB_STEP_SUMMARY"
            echo "The iOS IPA requires signing before installation." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: BahaPlus-test-build-${{ needs.validate.outputs.version }}${{ inputs.platform != 'android' && inputs.ios_build_mode == 'debug' && '-ios-debug' || '' }}
          path: test-package/*
          if-no-files-found: error
          retention-days: 14
