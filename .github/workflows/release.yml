name: Manual release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Select release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from the main branch."
            exit 1
          fi
          python3 tools/release_version.py

  reserve_tag:
    name: Reserve release tag
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create tag for the selected commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::main changed before the tag was created. Start a new manual release from the current main."
            exit 1
          fi
          # Reserving the tag while this commit is still the branch head also
          # keeps it releasable if workflow files change while builds are running.
          gh api "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"

  android:
    name: Build signed Android APK
    needs: [validate, reserve_tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Build signed APK
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/baha-plus-release.jks
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Android signing secret: $name"
              exit 1
            fi
          done
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          flutter pub get --enforce-lockfile
          flutter build apk --release --build-name "$RELEASE_VERSION" --build-number "$BUILD_NUMBER"
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/BahaPlus-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: app/release/BahaPlus-Android.apk
          if-no-files-found: error

  ios:
    name: Build unsigned iOS IPA
    needs: [validate, reserve_tag]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Build and package unsigned iOS app
        working-directory: app
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter build ios --release --no-codesign --build-name "$RELEASE_VERSION" --build-number "$BUILD_NUMBER"
          test -d build/ios/iphoneos/Runner.app
          mkdir -p release/Payload
          cp -R build/ios/iphoneos/Runner.app release/Payload/
          cd release
          ditto -c -k --sequesterRsrc --keepParent Payload BahaPlus-iOS-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: app/release/BahaPlus-iOS-unsigned.ipa
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [validate, reserve_tag, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::The release tag no longer points to the commit that was built."
            exit 1
          fi
          cd release
          sha256sum BahaPlus-Android.apk BahaPlus-iOS-unsigned.ipa > SHA256SUMS.txt
          previous_tag=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | [.created_at, .tag_name] | @tsv' \
            | sort | tail -n 1 | cut -f 2-)
          if [[ -n "$previous_tag" ]]; then
            if ! git merge-base --is-ancestor "refs/tags/$previous_tag^{commit}" "$GITHUB_SHA"; then
              echo "::error::The previous release tag is missing or is not an ancestor of this release."
              exit 1
            fi
            commit_range="refs/tags/$previous_tag..$GITHUB_SHA"
          else
            commit_range="$GITHUB_SHA"
          fi
          cat > release-notes.md <<'EOF'
          ## 下载说明

          - Android: signed release APK.
          - iOS: unsigned IPA. It must be signed with a suitable Apple identity and provisioning profile before it can be installed; it has not been verified on a device.
          - SHA256SUMS.txt contains the SHA-256 checksums of both files.

          ## 更新内容

          EOF
          if [[ -n "$previous_tag" ]]; then
            printf '以下为自 %s 以来的提交：\n\n' "$previous_tag" >> release-notes.md
          else
            printf '首次发布，以下为截至此版本的提交：\n\n' >> release-notes.md
          fi
          git log --no-merges --format='- %s (`%h`)' "$commit_range" >> release-notes.md
          printf '\n' >> release-notes.md
          args=(--verify-tag --draft --title "$RELEASE_TAG" --notes-file release-notes.md --generate-notes)
          if [[ -n "$previous_tag" ]]; then
            args+=(--notes-start-tag "$previous_tag")
          fi
          gh release create "$RELEASE_TAG" "${args[@]}" \
            BahaPlus-Android.apk BahaPlus-iOS-unsigned.ipa SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false
